              <TextView
                  android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:paddingTop="8dp"
                  android:text="Pausa en la lista antes de repetir el ciclo (segundos): mínimo / máximo" />
              <LinearLayout
                  android:layout_width="match_parent" android:layout_height="wrap_content"
